  build-sycl:
    name: SYCL ${{ matrix.sycl }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sycl:
          - "2026.1.1"
    container:
      image: intel/oneapi-toolkit:${{ matrix.sycl }}-devel-ubuntu26.04
    defaults:
      run:
        shell: bash
    env:
      BASH_ENV: /opt/intel/oneapi/setvars.sh
      SETVARS_ARGS: "--force"
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs cmake ninja-build libhdf5-dev libfmt-dev libcli11-dev

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: CMake configure
        run: >
          cmake
          -B build
          -G Ninja
          -D CMAKE_BUILD_TYPE=Release
          -D CMAKE_C_COMPILER=icx
          -D CMAKE_CXX_COMPILER=icpx
          -D PFFDTD_ENABLE_SYCL_ONEAPI=ON

      - name: CMake build
        run: cmake --build build
